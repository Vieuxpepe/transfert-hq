# Musica (the Listener) Character LoRA v2 - SDXL / Illustrious

[model_arguments]
pretrained_model_name_or_path = "C:/AI/stable-diffusion-webui-forge/models/Stable-diffusion/waiIllustriousSDXL_v170.safetensors"
no_half_vae = true

[dataset_arguments]
dataset_config = "C:/Transfert/tools/companion_lora/dataset_musica_config.toml"
cache_latents = true
cache_latents_to_disk = true

[network_arguments]
network_module = "networks.lora"
network_dim = 32
network_alpha = 16
network_train_unet_only = false

[optimizer_arguments]
optimizer_type = "AdamW8bit"
learning_rate = 1e-4
unet_lr = 1e-4
text_encoder_lr = 5e-5
lr_scheduler = "cosine_with_restarts"
lr_scheduler_num_cycles = 1
lr_warmup_steps = 25

[training_arguments]
output_dir = "C:/Transfert/.hq-ai/musica_lora_output"
output_name = "musica_char"
save_model_as = "safetensors"
save_every_n_epochs = 2
max_train_epochs = 8
mixed_precision = "bf16"
save_precision = "fp16"
gradient_checkpointing = true
sdpa = true
fp8_base = true
min_snr_gamma = 5.0
noise_offset = 0.03
max_data_loader_n_workers = 0
seed = 42
logging_dir = "C:/Transfert/.hq-ai/musica_lora_logs"
log_prefix = "musica_char"
