<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dangling member — extracted vein paths</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #ccc; margin: 24px; }
    h1 { font-size: 1.1rem; font-weight: 500; }
    p { font-size: 0.9rem; max-width: 36rem; line-height: 1.45; }
    svg { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; display: block; margin: 16px 0; }
    .legend span { margin-right: 16px; }
    .swatch { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
  </style>
</head>
<body>
  <h1>Vein trace paths (texture space)</h1>
  <p>From <code>assets/dangling-member-vein-paths.json</code>. Vertical: <strong>t</strong> 0→1 (base at top, tip at bottom). Horizontal: <strong>lane</strong> × local half-width from centerline.</p>
  <p class="legend">
    <span><i class="swatch" style="background:#e87888"></i>Left trace</span>
    <span><i class="swatch" style="background:#6aaede"></i>Right trace</span>
  </p>
  <svg viewBox="0 0 153 486" width="230" height="730" role="img" aria-label="Vein paths sketch">
    <path id="sil" fill="rgba(180,140,130,0.15)" stroke="#666" stroke-width="0.8"/>
    <line x1="76.5" y1="10" x2="76.5" y2="476" stroke="#555" stroke-dasharray="4 5" stroke-width="0.6"/>
    <polyline id="left" fill="none" stroke="#e87888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="right" fill="none" stroke="#6aaede" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="dotsL"></g>
    <g id="dotsR"></g>
    <text x="76.5" y="22" text-anchor="middle" fill="#888" font-size="11">base</text>
    <text x="76.5" y="472" text-anchor="middle" fill="#888" font-size="11">tip</text>
  </svg>
  <p>Open this file in any browser. Regenerate paths: <code>python scripts/extract_dangling_vein_paths.py</code></p>
  <script>
    const W = 153, H = 486, CX = W / 2;
    const data = {"left":[[0.1196,-0.3105],[0.1567,-0.5737],[0.2,-0.8735],[0.2433,-0.6822],[0.2866,-0.8146],[0.3299,-0.5832],[0.3732,-0.6239],[0.4165,-0.26],[0.4536,-0.5692],[0.5031,-0.3642],[0.5464,-0.2445],[0.5959,-0.5157],[0.6392,-0.4364],[0.6825,-0.6499],[0.7258,-0.2769],[0.7691,-0.4511],[0.8062,-0.649],[0.8495,-0.6932],[0.8928,-0.7952],[0.9361,-0.4766]],"right":[[0.1196,0.4352],[0.1567,0.8249],[0.2,0.8478],[0.2433,0.3696],[0.2866,0.5922],[0.3237,0.4347],[0.367,0.2551],[0.4103,0.3498],[0.4536,0.416],[0.5031,0.4669],[0.5402,0.6472],[0.5835,0.7223],[0.633,0.3303],[0.6763,0.5343],[0.7196,0.4308],[0.7629,0.4234],[0.8062,0.5253],[0.8495,0.7133],[0.8928,0.7891],[0.9361,0.4667]]};
    const halfW = t => 42 * (0.9 + 0.1 * Math.sin(t * Math.PI));
    const xy = (t, lane) => ({ x: CX + lane * halfW(t), y: t * H });
    const poly = knots => knots.map(k => { const p = xy(k[0], k[1]); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(" ");
    const sil = () => {
      const L = [], R = [];
      for (let i = 0; i <= 32; i++) {
        const t = 0.08 + 0.88 * i / 32;
        const hw = halfW(t) * 1.02;
        const y = t * H;
        L.push(`${(CX - hw).toFixed(1)},${y.toFixed(1)}`);
        R.push(`${(CX + hw).toFixed(1)},${y.toFixed(1)}`);
      }
      return `M${L.join(" L")} L${R.reverse().join(" L")} Z`;
    };
    document.getElementById("sil").setAttribute("d", sil());
    document.getElementById("left").setAttribute("points", poly(data.left));
    document.getElementById("right").setAttribute("points", poly(data.right));
    function dots(g, knots, col) {
      knots.forEach((k, i) => {
        const p = xy(k[0], k[1]);
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
        c.setAttribute("r", i === 0 || i === knots.length - 1 ? 3.5 : 2.2);
        c.setAttribute("fill", col);
        g.appendChild(c);
      });
    }
    dots(document.getElementById("dotsL"), data.left, "#e87888");
    dots(document.getElementById("dotsR"), data.right, "#6aaede");
  </script>
</body>
</html>
